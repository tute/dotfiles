# tmux loads ~/.tmux.conf before ~/.config/tmux/tmux.conf, so Omarchy's file
# wins by default. Load Omarchy first here, then re-apply mine on top.

source-file ~/.local/share/omarchy/config/tmux/tmux.conf
source-file ~/.tmux.conf

# Omarchy sets prefix C-Space; tb-dotfiles assumes the C-b default.
set -g prefix C-b

# tb-dotfiles downgrades this to screen-256color, losing italics and undercurl.
# Omarchy's terminal-overrides and terminal-features survive on their own.
set -g default-terminal "tmux-256color"

# Rebinding a key without -N drops its note, so the tb-dotfiles pane keys fall
# out of the Omarchy keybindings popup. Restate them with notes. Not C-l, which
# tmux.conf.local keeps as the clear command.
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R
bind -N "Previous window" -r C-h select-window -t :-
