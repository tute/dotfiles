# tmux loads ~/.tmux.conf before ~/.config/tmux/tmux.conf, so Omarchy's file
# wins by default. Load Omarchy first here, then re-apply mine on top.

source-file ~/.local/share/omarchy/config/tmux/tmux.conf
source-file ~/.tmux.conf

# Omarchy sets prefix C-Space; tb-dotfiles assumes the C-b default.
set -g prefix C-b
